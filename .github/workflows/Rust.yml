name: Rust

on:
  pull_request:

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install LLVM 19
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19 clang-19 lld-19
        echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
    - name: Prepare
      run: make prepare
    - name: Build C implementation
      run: cd c && make all
    - name: Format & Clippy
      run: make clippy && cargo fmt -- --check
    - name: Build
      run: make build
    - name: Test
      run: make test
